<div class="fintech-app">
    <h1>💰 Investment Growth Calculator</h1>
    <p class="tagline">See how your money grows with compound interest</p>

    <div class="input-group">
        <label>Initial Investment ($)</label>
        <input type="number" id="principal" value="10000" min="0">
    </div>

    <div class="input-group">
        <label>Monthly Contribution ($)</label>
        <input type="number" id="monthly" value="500" min="0">
    </div>

    <div class="input-group">
        <label>Annual Interest Rate (%)</label>
        <input type="range" id="rate" min="1" max="15" value="7" step="0.5">
        <span id="rateDisplay">7%</span>
    </div>

    <div class="input-group">
        <label>Investment Period (Years)</label>
        <input type="range" id="years" min="1" max="40" value="10">
        <span id="yearsDisplay">10 years</span>
    </div>

    <button onclick="calculate()">📊 Calculate Growth</button>

    <div id="results" class="results hidden">
        <div class="result-card">
            <h3>Total Invested</h3>
            <p id="totalInvested" class="amount">$0</p>
        </div>
        <div class="result-card highlight">
            <h3>Future Value</h3>
            <p id="futureValue" class="amount">$0</p>
        </div>
        <div class="result-card">
            <h3>Total Interest Earned</h3>
            <p id="interestEarned" class="amount green">$0</p>
        </div>
    </div>

    <div id="yearlyBreakdown" class="breakdown"></div>
</div>
